<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHORDS</title>
</head>
<body>
<textarea id="chord" style="width:100%; height: 120px;">
x x 0 2 3 2
</textarea>
<div id="result">
</div>
</body>
<script type="module">
    import * as C from "./chords.js";

    document.getElementById("chord").oninput = function () {
        const text = document.getElementById("chord").value;
        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length);
        const result = lines.map(line => {
            const chord = C.GChord.parse(line);
            const sc = chord.toStringChord();
            const fc = sc.toFingerChord();
            return chord.toString() + "\n" +
                sc.toString() + "\n" +
                `<div>${fc.toHTML()}</div>
                ;
        }).join("\n\n");
        
        document.getElementById("result").innerHTML = result;
    };
</script>
</html>
