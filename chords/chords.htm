<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHORDS</title>
    <style>
        .chord {
            padding: 0.25rem;
        }

        *[fh-strings] {
            color: black;

        }

        *[fh-strings='unplayed'] {
            color: gray;

        }

        *[fh-indicator] {
            color: lightgray;

        }

        *[fh-string] {
            padding: 0.05rem;

        }

        *[fh-fret] {
            background-color: wheat;
            padding: 0.25rem;

        }
    </style>
</head>

<body>
    <textarea id="chord" style="width:100%; height: 120px;">
x x 0 2 3 2
</textarea>
    <div id="result">
    </div>
</body>
<script type="module">
    import * as C from "./chords.js";

    document.getElementById("chord").oninput = function () {
        const text = document.getElementById("chord").value;
        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length);
        const result = lines.map(line => {
            const chord = C.GChord.parse(line);
            const sc = chord.toStringChord();
            const fc = sc.toFingerChord();
            return `<div class="chord">${chord.toHTML()}</div>` + "\n" +
                `<div class="chord">${sc.toHTML()}</div>` + "\n" +
                `<div class="chord">${fc.toHTML()}</div>`
                ;
        }).join("\n\n");

        document.getElementById("result").innerHTML = result;
    };
</script>

</html>
